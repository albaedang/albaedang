name: Refresh public market data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1-5'
permissions:
  contents: write
  pages: write
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/collect_public_market.py --output data/market/v1 --dividends
      - name: Publish validated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/v1
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public market JSON"
            git push
            gh api --method POST repos/${{ github.repository }}/pages/builds
          fi
